name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        run: pnpm --filter @koe/web lint
      - name: Typecheck
        run: pnpm --filter @koe/web typecheck
      - name: Build web
        run: pnpm --filter @koe/web build
      - name: Build API
        run: pnpm --filter @koe/api build
      - name: Test and compile contracts
        run: pnpm --filter @koe/contracts test && pnpm --filter @koe/contracts build
